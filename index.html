<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorem ipsum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar" aria-label="Lorem ipsum">
    <a href="#card">Lorem ipsum</a>
  </nav>

  <main>
    <article class="card" id="card">
      <span class="badge">ХИТ</span>
      <h1>Lorem ipsum dolor sit amet</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      <button class="modal-open" type="button">Lorem ipsum</button>
    </article>
  </main>

  <div class="modal-overlay" id="modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" aria-label="Закрыть">&times;</button>
      <h2 id="modal-title">Lorem ipsum</h2>
      <p>Lorem ipsum dolor sit amet.</p>
    </section>
  </div>

  <script>
    const modal = document.querySelector("#modal");

    document.querySelector(".modal-open").addEventListener("click", () => {
      modal.hidden = false;
    });

    document.querySelector(".modal-close").addEventListener("click", () => {
      modal.hidden = true;
    });
  </script>
</body>
</html>
